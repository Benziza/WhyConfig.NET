name: Publish NuGet tool

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.4xx'
      - run: dotnet test WhyConfig.slnx -c Release
      - run: dotnet pack src/WhyConfig.Cli/WhyConfig.Cli.csproj -c Release --no-restore -o artifacts
      - name: Sign in to NuGet.org
        id: login
        uses: NuGet/login@v1
        with:
          user: Benziza
      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/WhyConfig.NET.*.nupkg --source https://api.nuget.org/v3/index.json
